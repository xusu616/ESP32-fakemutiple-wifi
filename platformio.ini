; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
debug_tool = esp-builtin
debug_init_break = tbreak setup

; 板载 PSRAM 8MB。ESP32-S3 常见组合是 flash 走 QIO、PSRAM 走 8 线 OPI -> qio_opi。
; 注意：memory_type 只影响 flash 模式和启动模式，光配它并不会启用 PSRAM，
; 必须同时加 -DBOARD_HAS_PSRAM（见下面的 build_flags）。
board_build.arduino.memory_type = qio_opi

; ESP32-S3 原生 USB 配置
; ARDUINO_USB_MODE=1 -> 走硬件 USB-Serial-JTAG（而非 TinyUSB）
; ARDUINO_USB_CDC_ON_BOOT=1 -> Serial 直接输出到 USB 口
; 这两项的组合很关键：USB-Serial-JTAG 在“下载模式”和“运行模式”下
; 枚举出的 VID:PID 都是 303A:1001，所以 esptool 每次都能自己复位进下载模式。
; 反之如果用了 TinyUSB（USB_MODE=0），运行时会变成 303A:4001，
; 自动复位失效，每次烧录都得手按 BOOT 键。
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM

monitor_speed = 115200
